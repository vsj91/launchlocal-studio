<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Template Preview | LaunchLocal Studio</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../template-demo.css">
    <script src="template-options.js"></script>
  </head>
  <body>
    <header class="demo-header">
      <a class="demo-brand" href="../index.html#templates"><span class="demo-mark" id="brandMark">LL</span><span id="brandName">Template Preview</span></a>
      <nav><a href="#services">Services</a><a href="#gallery">Gallery</a><a href="#reviews">Reviews</a><a href="#contact">Contact</a></nav>
    </header>
    <main id="previewRoot"></main>
    <script>
      const { category, style, categoryKey, styleKey } = getTemplate();
      document.body.className = `${category.accent} style-${styleKey}`;
      const brand = `${style[0]} ${category.category}`;
      document.title = `${brand} Template | LaunchLocal Studio`;
      document.querySelector("#brandMark").textContent = category.category.replace(/&/g, "").split(" ").filter(Boolean).map(word => word[0]).join("").slice(0, 2);
      document.querySelector("#brandName").textContent = brand;

      const serviceCards = category.services.map(item => `<article><h3>${item[0]}</h3><p>${item[1]}</p><strong>${item[2]}</strong></article>`).join("");
      const gallery = category.gallery.map((src, index) => `<img src="${src}" alt="${category.category} sample gallery image ${index + 1}">`).join("");
      const reviews = category.reviews.map((review, index) => `<article><p>“${review}”</p><strong>Customer ${index + 1}</strong></article>`).join("");
      const map = `https://www.google.com/maps?q=${encodeURIComponent(category.city)}&output=embed`;
      const phoneDigits = category.phone.replace(/\D/g, "");

      document.querySelector("#previewRoot").innerHTML = `
        <section class="demo-hero">
          <div class="demo-copy">
            <p class="demo-eyebrow">${style[0]} template for ${category.category}</p>
            <h1>A production-ready ${category.category.toLowerCase()} website with premium sample content.</h1>
            <p>${style[1]} This preview includes realistic sections, CTAs, trust proof, service details, visuals, reviews, map and mobile-first contact actions.</p>
            <div class="demo-actions">
              <a class="demo-button" href="tel:${category.phone}">Call now</a>
              <a class="demo-button ghost" href="https://wa.me/${phoneDigits}">WhatsApp enquiry</a>
            </div>
            <ul class="demo-proof">
              <li>Mobile ready</li>
              <li>Google Maps</li>
              <li>WhatsApp CTA</li>
              <li>SEO sections</li>
            </ul>
          </div>
          <div class="demo-hero-card">
            <img src="${category.heroImage}" alt="${category.category} hero preview">
            <div class="hero-info"><span>Template option</span><strong>${style[0]} layout</strong><span>Designed for ${category.category.toLowerCase()} businesses in India.</span></div>
          </div>
        </section>
        <section class="metric-strip">
          <div><strong>5+</strong><span>core content sections</span></div>
          <div><strong>₹6,999</strong><span>complete website package</span></div>
          <div><strong>₹2,499</strong><span>annual renewal</span></div>
          <div><strong>1 week</strong><span>typical launch window</span></div>
        </section>
        <section class="demo-section" id="services">
          <div class="section-top"><div><p class="demo-eyebrow">Services and offer blocks</p><h2>Detailed content that feels like a real business website.</h2></div><p>Each card can be replaced with your actual services, products, packages, timings and prices.</p></div>
          <div class="demo-grid">${serviceCards}</div>
        </section>
        <section class="demo-section showcase">
          <div>
            <p class="demo-eyebrow">Conversion structure</p>
            <h2>Built to convert local search traffic into calls and enquiries.</h2>
            <ul class="check-list">
              <li>Strong hero section with immediate contact actions</li>
              <li>Service, price and package sections for quick decisions</li>
              <li>Photo gallery, trust metrics and customer reviews</li>
              <li>Location, map, hours and mobile-friendly call buttons</li>
              <li>Room for FAQs, offers, business story and team details</li>
            </ul>
          </div>
          <img src="${category.gallery[0]}" alt="${category.category} showcase">
        </section>
        <section class="demo-section feature-grid-section">
          <p class="demo-eyebrow">Website sections included</p>
          <h2>More than a landing page. A complete small-business presence.</h2>
          <div class="feature-grid">
            <article><h3>Business Story</h3><p>Introduce the owner, team, experience and what makes the business trustworthy.</p><strong>About section</strong></article>
            <article><h3>Offer Banner</h3><p>Promote seasonal discounts, new launches, packages or admission notices.</p><strong>Campaign ready</strong></article>
            <article><h3>FAQ Section</h3><p>Answer common questions about pricing, timings, appointments, visits and service areas.</p><strong>Reduces calls</strong></article>
          </div>
        </section>
        <section class="demo-section" id="gallery">
          <p class="demo-eyebrow">Gallery</p>
          <h2>Visual sections for products, space, work quality and ambience.</h2>
          <div class="demo-gallery">${gallery}</div>
        </section>
        <section class="demo-section" id="reviews">
          <p class="demo-eyebrow">Customer reviews</p>
          <h2>Social proof placed before the final contact section.</h2>
          <div class="review-grid">${reviews}</div>
        </section>
        <section class="demo-section demo-contact" id="contact">
          <div><p class="demo-eyebrow">Location and contact</p><h2>${category.city}</h2><p>Replace with your real address, timings, phone number, Google Maps link and WhatsApp number.</p><div class="demo-actions"><a class="demo-button" href="tel:${category.phone}">Call now</a><a class="demo-button ghost" href="https://wa.me/${phoneDigits}">WhatsApp</a></div></div>
          <iframe title="Sample Google Map" src="${map}"></iframe>
        </section>
        <section class="demo-section final-cta">
          <p class="demo-eyebrow">Use this option</p>
          <h2>Want the ${style[0]} ${category.category} template?</h2>
          <p class="wide-copy">We can customize this exact structure with your logo, photos, services, reviews, domain, hosting, SEO basics, WhatsApp and Google Maps.</p>
          <div class="demo-actions"><a class="demo-button" href="../index.html#quote">Request this template</a><a class="demo-button ghost" href="../index.html#templates">View more options</a></div>
        </section>
      `;
    </script>
  </body>
</html>
